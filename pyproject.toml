[project]
name = "markdown-lt"
version = "0.1.0"
description = "A Markdown-based slide preview app that renders slides in a browser with live refresh."
readme = "README.md"
authors = [
    { name = "Tatsuki", email = "tatsuki.devel@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "markdown>=3.6.0",
    "watchfiles>=0.22.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "markdown-it-py>=4.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
mdlt = "markdown_lt.cli:main"
lt = "markdown_lt.cli:main"
markdown-lt = "markdown_lt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_lt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
